<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isaiah's Taco Truck</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="p-6">
    
    <h1 class="text-2xl font-bold">Isaiah's Taco Truck</h1>

    <p id="status" class="mb-4">Closed</p>

    <button id="open-button" class="border px-3 py-1">Open the truck</button>

    <div class="my-4">
        <label for="new-item" class="block mb-1">What do we need?</label>
        <input id="new-item" type="text" class="border p-2">
        <button id="add-button" class="border px-3 py-1">Add</button>
    </div>

    <ul id="prep-list" class="list-disc pl-5">

    </ul>

    <script src="script.js"></script>
</body>
</html>
